{% extends "base.html" %}
{% block page_css %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
{% endblock %}
{% block content %}
<div class="container">
  <div class="row">
    <div class="col-md-6">
      <canvas id="countryChart"></canvas>
    </div>
    <div class="col-md-6">
      <canvas id="endpointChart"></canvas>
    </div>
  </div>
</div>
<script id="countryChartData" type="application/json">{{ country_chart_data | tojson }}</script>
<script id="endpointChartData" type="application/json">{{ endpoint_chart_data | tojson }}</script>
<script>
  const countryChartData = JSON.parse(
    document.getElementById('countryChartData').textContent
  );
  const endpointChartData = JSON.parse(
    document.getElementById('endpointChartData').textContent
  );

  function createBarChart(canvasId, chartData, labelKey, xAxisTitle) {
    const ctx = document.getElementById(canvasId);

    return new Chart(ctx, {
      type: 'bar',
      data: {
        labels: chartData[labelKey],
        datasets: [{
          data: chartData.percentages,
          borderWidth: 1
        }]
      },
      options: {
        plugins: {
          title: {
            display: true,
            text: chartData.title,
            font: {
              family: 'Arial',
              size: 18
            }
          },
          legend: {
            display: false
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            title: {
              display: true,
              text: '% of (Human) Visits',
              color: '#111',
              font: {
                family: 'Arial',
                size: 16
              }
            }
          },
          x: {
            title: {
              display: true,
              text: xAxisTitle,
              color: '#111',
              font: {
                family: 'Arial',
                size: 16
              }
            }
          }
        }
      }
    });
  }

  createBarChart('countryChart', countryChartData, 'countryCodes', 'Country Code');
  createBarChart('endpointChart', endpointChartData, 'endpoints', 'Endpoint');
</script>
{% endblock %}
