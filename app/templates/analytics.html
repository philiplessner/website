{% extends "base.html" %}
{% block page_css %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
{% endblock %}
{% block content %}
<div class="container">
  <div class="row">
    <div class="col-md-6">
      <canvas id="countryChartHumans"></canvas>
    </div>
    <div class="col-md-6">
      <canvas id="endpointChartHumans"></canvas>
    </div>
  </div>
  <div class="row mt-4">
    <div class="col-md-6">
      <canvas id="countryChartRobots"></canvas>
    </div>
    <div class="col-md-6">
      <canvas id="endpointChartRobots"></canvas>
    </div>
  </div>
  <div class="row mt-4">
    <div class="col-12">
      <canvas id="visitsChart"></canvas>
    </div>
  </div>
</div>
<script id="countryChartDataHumans" type="application/json">{{ country_chart_data_humans | tojson }}</script>
<script id="endpointChartDataHumans" type="application/json">{{ endpoint_chart_data_humans | tojson }}</script>
<script id="countryChartDataRobots" type="application/json">{{ country_chart_data_robots | tojson }}</script>
<script id="endpointChartDataRobots" type="application/json">{{ endpoint_chart_data_robots | tojson }}</script>
<script id="visitsChartData" type="application/json">{{ visits_chart_data | tojson }}</script>
<script>
  const countryChartDataHumans = JSON.parse(
    document.getElementById('countryChartDataHumans').textContent
  );
  const endpointChartDataHumans = JSON.parse(
    document.getElementById('endpointChartDataHumans').textContent
  );
  const countryChartDataRobots = JSON.parse(
    document.getElementById('countryChartDataRobots').textContent
  );
  const endpointChartDataRobots = JSON.parse(
    document.getElementById('endpointChartDataRobots').textContent
  );
  const visitsChartData = JSON.parse(
    document.getElementById('visitsChartData').textContent
  );

  function createBarChart(canvasId, chartData, labelKey, xAxisTitle, yAxisTitle) {
    const ctx = document.getElementById(canvasId);

    return new Chart(ctx, {
      type: 'bar',
      data: {
        labels: chartData[labelKey],
        datasets: [{
          data: chartData.percentages,
          borderWidth: 1
        }]
      },
      options: {
        plugins: {
          title: {
            display: true,
            text: chartData.title,
            font: {
              family: 'Arial',
              size: 18
            }
          },
          legend: {
            display: false
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            title: {
              display: true,
              text: yAxisTitle,
              color: '#111',
              font: {
                family: 'Arial',
                size: 16
              }
            }
          },
          x: {
            title: {
              display: true,
              text: xAxisTitle,
              color: '#111',
              font: {
                family: 'Arial',
                size: 16
              }
            }
          }
        }
      }
    });
  }

  function createLineChart(canvasId, chartData) {
    const ctx = document.getElementById(canvasId);

    return new Chart(ctx, {
      type: 'line',
      data: {
        labels: chartData.dates,
        datasets: [
          {
            label: 'Human Visits',
            data: chartData.humans,
            borderColor: '#0d6efd',
            backgroundColor: '#0d6efd',
            tension: 0.1
          },
          {
            label: 'Robot Visits',
            data: chartData.robots,
            borderColor: '#dc3545',
            backgroundColor: '#dc3545',
            tension: 0.1
          }
        ]
      },
      options: {
        plugins: {
          title: {
            display: true,
            text: 'Daily Website Visits',
            font: {
              family: 'Arial',
              size: 18
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            title: {
              display: true,
              text: 'Visits',
              color: '#111',
              font: {
                family: 'Arial',
                size: 16
              }
            }
          },
          x: {
            title: {
              display: true,
              text: 'Date',
              color: '#111',
              font: {
                family: 'Arial',
                size: 16
              }
            }
          }
        }
      }
    });
  }

  createBarChart(
    'countryChartHumans',
    countryChartDataHumans,
    'countryCodes',
    'Country Code',
    '% of Human Visits'
  );
  createBarChart(
    'endpointChartHumans',
    endpointChartDataHumans,
    'endpoints',
    'Endpoint',
    '% of Human Visits'
  );
  createBarChart(
    'countryChartRobots',
    countryChartDataRobots,
    'countryCodes',
    'Country Code',
    '% of Robot Visits'
  );
  createBarChart(
    'endpointChartRobots',
    endpointChartDataRobots,
    'endpoints',
    'Endpoint',
    '% of Robot Visits'
  );
  createLineChart('visitsChart', visitsChartData);
</script>
{% endblock %}
